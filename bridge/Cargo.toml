# Urë atestimi TLSNotary -> atestim RSA i qarkut zkTLS.
# Workspace më vete: TLSNotary (MPC-TLS) ka shumë varësi dhe kompilim të gjatë,
# ndaj nuk ngadalëson CI-në e crate-ve kryesore.
[workspace]

[package]
name = "zktls-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Noter TLSNotary + urë që kthen prezantimet TLSNotary në atestime RSA për qarkun zkTLS"
publish = false

[dependencies]
# TLSNotary: fiksuar në një tag, sepse API-ja ndryshon mes versioneve alpha
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
zktls-prover = { path = "../crates/zktls-prover" }
anyhow = "1"
bincode = "1.3"
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1.1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
# zktls-fetch → ura me HTTPS (p.sh. https://<app>.fly.dev:8790)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
ark-bn254 = "0.5"
rand = "0.8"

[profile.dev]
# MPC-TLS është shumë i ngadaltë pa optimizim
opt-level = 2
