name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            programs/solana-zk-verifier
            programs/gated-pool
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p triad-core --no-default-features
      - name: Testet native të programit Anchor
        run: |
          cargo test --manifest-path programs/solana-zk-verifier/Cargo.toml
          cargo clippy --manifest-path programs/gated-pool/Cargo.toml -- -D warnings

  # Demo web (app/) + daemon-i që e shërben: build i faqes dhe rrjedha HTTP
  # /mock-session → /prove që përdor faqja.
  web-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Typecheck i testeve TS të programit
        run: npm ci && npm run typecheck
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Daemon-i i demos (noter i simuluar)
        run: |
          cargo build -q --release -p coprocessor-cli
          B=target/release/coprocessor
          $B setup --out-dir artifacts/demo
          K=ci-key-0123456789abcdef
          PROVER_API_KEYS=$K PROVER_RATE_LIMIT=30 \
          $B serve --addr 127.0.0.1:8787 --pk artifacts/demo/dev_pk.bin \
            --mock-notary-key tests/fixtures/mock_notary_key.pem \
            --mock-notary-cert tests/fixtures/mock_notary_cert.pem &
          for i in $(seq 30); do curl -sf localhost:8787/health && break; sleep 1; done
          W=4wBqpZM9xaSheZzJSMawUKKwhdpChKbZ5eu5ky4Vigw
          # pa çelës -> 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8787/mock-session -d '{}')
          test "$code" = 401
          curl -sf -X POST -H "x-api-key: $K" localhost:8787/mock-session \
            -d "{\"kind\":\"age\",\"dob\":\"2001-05-17\",\"account_id\":\"J1\",\"wallet\":\"$W\"}" > s.json
          jq -n --slurpfile s s.json '{session: $s[0], min_age: 18, app: "demo"}' \
            | curl -sf -X POST -H "x-api-key: $K" localhost:8787/prove -d @- > p.json
          jq -e '.public_inputs | length == 10' p.json
          $B verify --proof p.json --vk artifacts/demo/vk.json
          # i mitur -> 400
          curl -sf -X POST -H "x-api-key: $K" localhost:8787/mock-session \
            -d "{\"kind\":\"age\",\"dob\":\"2012-01-01\",\"account_id\":\"J2\",\"wallet\":\"$W\"}" > m.json
          code=$(jq -n --slurpfile s m.json '{session: $s[0], min_age: 18, app: "demo"}' \
            | curl -s -o /dev/null -w '%{http_code}' -X POST -H "x-api-key: $K" localhost:8787/prove -d @-)
          test "$code" = 400
          # kufiri për IP: 61 kërkesa (mbi 2 dritare) -> të paktën një 429
          n=0; for i in $(seq 61); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "x-api-key: $K" localhost:8787/mock-session -d '{}')
            [ "$c" = 429 ] && n=$((n+1)); done
          echo "429: $n"; test "$n" -gt 0

  # Noteri real TLSNotary (MPC-TLS) + ura drejt atestimit RSA: sesion i plotë
  # me një bankë testuese TLS, prezantim, urë, provë Groth16.
  tlsnotary-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --nocapture
