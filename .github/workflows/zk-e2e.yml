name: ZK E2E

# Qarku i plotë Circom (RSA-2048 + SHA-256) dhe programi Solana në localnet.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CIRCOM_VERSION: v2.1.9
  SNARKJS_VERSION: 0.7.6
  RAPIDSNARK_VERSION: v0.0.8
  ANCHOR_VERSION: v0.31.1
  WALLET: 4wBqpZM9xaSheZzJSMawUKKwhdpChKbZ5eu5ky4Vigw

jobs:
  circuits:
    name: Circom → Groth16 → verifikim
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache circom
        id: circom-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circom
          key: circom-${{ env.CIRCOM_VERSION }}-${{ runner.os }}
      - name: Instalo circom
        if: steps.circom-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/iden3/circom.git --tag "$CIRCOM_VERSION" circom --locked
      - name: Instalo snarkjs
        run: npm install -g "snarkjs@$SNARKJS_VERSION"

      - name: Varësitë e dëshmitarit C++
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm libgmp-dev nlohmann-json3-dev

      - name: Kompilo qarkun
        working-directory: circuits
        env:
          CPP_WITNESS: "1"
        run: |
          npm install
          circom --version
          bash scripts/compile.sh

      - name: Cache ptau
        uses: actions/cache@v4
        with:
          path: circuits/build/ppot_0080_*.ptau
          key: ppot-${{ hashFiles('circuits/*.circom') }}
          restore-keys: ppot-

      - name: Ceremonia Groth16 (ptau + zkey)
        working-directory: circuits
        env:
          SNARKJS: snarkjs
          NODE_OPTIONS: --max-old-space-size=12000
        run: bash scripts/setup_keys.sh

      - name: Provë me qarkun e plotë
        run: |
          cargo build --release -p coprocessor-cli
          B=target/release/coprocessor
          mkdir -p artifacts
          $B export-vk --snarkjs-vk circuits/build/verification_key.json --out artifacts/vk.json
          $B mock-session --key tests/fixtures/mock_notary_key.pem --cert tests/fixtures/mock_notary_cert.pem \
            --balance 15200 --wallet "$WALLET" --out artifacts/session.tls.json
          /usr/bin/time -v $B prove --backend snarkjs --keep-files target/snarkjs --input artifacts/session.tls.json --min 10000 \
            --wasm circuits/build/main_js/main.wasm --zkey circuits/build/main_final.zkey \
            --witness-out artifacts/input.json --out artifacts/proof.json 2> artifacts/prove_time.txt \
            || { cat artifacts/prove_time.txt; exit 1; }
          grep -E "Elapsed|Maximum resident" artifacts/prove_time.txt
          snarkjs groth16 verify circuits/build/verification_key.json target/snarkjs/public.json target/snarkjs/proof.json
          $B verify --proof artifacts/proof.json --vk artifacts/vk.json
          jq -n --slurpfile vk artifacts/vk.json --slurpfile p artifacts/proof.json \
            '{note: "Prove e qarkut Circom nga CI", wallet: $p[0].wallet, vk: $vk[0], proof: $p[0]}' \
            > artifacts/circom_fixture.json

      - name: Cache rapidsnark
        id: rapidsnark-cache
        uses: actions/cache@v4
        with:
          path: ~/rapidsnark
          key: rapidsnark-${{ env.RAPIDSNARK_VERSION }}-${{ runner.os }}
      - name: Instalo rapidsnark
        if: steps.rapidsnark-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/rapidsnark /tmp/rs && cd /tmp/rs
          # binari i gatshëm nga release; nëse mungon, kompilim nga kodi burimor
          if gh release download "$RAPIDSNARK_VERSION" -R iden3/rapidsnark --pattern '*linux-x86_64*' 2>/dev/null; then
            for f in *; do case "$f" in *.zip) unzip -q "$f";; *.tar.gz) tar xzf "$f";; esac; done
            cp "$(find . -type f -name prover | head -1)" ~/rapidsnark/prover
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake m4 nasm libsodium-dev
            git clone -q --depth 1 --branch "$RAPIDSNARK_VERSION" --recursive https://github.com/iden3/rapidsnark .
            ./build_gmp.sh host
            cmake -S . -B build -DTARGET_PLATFORM=x86_64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=pkg
            cmake --build build -j4 && cmake --install build
            cp pkg/bin/prover ~/rapidsnark/prover
          fi
          chmod +x ~/rapidsnark/prover

      - name: rapidsnark kundrejt snarkjs (i njëjti qark, e njëjta zkey)
        run: |
          B=target/release/coprocessor
          nproc
          run() {  # emri backend [argumente shtesë]
            name=$1; backend=$2; shift 2
            /usr/bin/time -v $B prove --backend $backend --rapidsnark ~/rapidsnark/prover "$@" \
              --input artifacts/session.tls.json --min 10000 \
              --wasm circuits/build/main_js/main.wasm --zkey circuits/build/main_final.zkey \
              --out artifacts/proof_$name.json 2> artifacts/time_$name.txt \
              || { cat artifacts/time_$name.txt; exit 1; }
            $B verify --proof artifacts/proof_$name.json --vk artifacts/vk.json
            echo "== $name"; grep -E "kohët|Elapsed|Maximum resident|Percent of CPU" artifacts/time_$name.txt
          }
          run snarkjs snarkjs
          run rapidsnark rapidsnark
          run rapidsnark+cpp rapidsnark --witness-bin circuits/build/cpp/main_c_cpp/main_c
          {
            echo "### Koha e provës, qarku i plotë (277k kufizime)"
            echo '| backend | dëshmitari + prova | gjithsej | RAM max | CPU |'
            echo '|---|---|---|---|---|'
            for backend in snarkjs rapidsnark rapidsnark+cpp; do
              f=artifacts/time_$backend.txt
              echo "| $backend | $(grep kohët $f | sed 's/kohët: //') | $(grep Elapsed $f | awk '{print $NF}') | $(grep Maximum $f | awk '{printf "%.0f MB", $NF/1024}') | $(grep Percent $f | awk '{print $NF}') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Daemon-i me rapidsnark nën ngarkesë (izolimi i klientëve)
        run: |
          B=target/release/coprocessor
          $B serve --addr 127.0.0.1:8787 --backend rapidsnark --rapidsnark ~/rapidsnark/prover \
            --witness-bin circuits/build/cpp/main_c_cpp/main_c \
            --wasm circuits/build/main_js/main.wasm --zkey circuits/build/main_final.zkey \
            --mock-notary-key tests/fixtures/mock_notary_key.pem \
            --mock-notary-cert tests/fixtures/mock_notary_cert.pem > serve.log 2>&1 &
          PID=$!
          for i in $(seq 30); do curl -sf localhost:8787/health && break; sleep 1; done
          cat serve.log
          {
            echo "### Daemon-i (rapidsnark + dëshmitar C++), $(nproc) bërthama, 16 klientë"
            PID=$PID MD=1 VK=artifacts/vk.json BIN=$B python3 scripts/load_test.py http://127.0.0.1:8787 16 1,4,16
          } | tee -a "$GITHUB_STEP_SUMMARY"
          kill $PID

      - name: Testet negative
        run: |
          B=target/release/coprocessor
          # pragu mbi bilancin -> duhet të dështojë
          if $B prove --backend snarkjs --input artifacts/session.tls.json --min 20000 \
               --wasm circuits/build/main_js/main.wasm --zkey circuits/build/main_final.zkey --out /tmp/x.json; then
            echo "prova duhej të dështonte"; exit 1
          fi
          # witness me bilanc të ndryshuar në mesazh -> qarku duhet ta refuzojë (RSA)
          jq '.attestation_msg[15] = "99"' artifacts/input.json > /tmp/bad_input.json
          if snarkjs wtns calculate circuits/build/main_js/main.wasm /tmp/bad_input.json /tmp/bad.wtns; then
            echo "qarku pranoi mesazh të ndryshuar"; exit 1
          fi
          echo "OK: refuzimet funksionojnë"

      - name: Provë moshe ≥ 18 me qarkun e plotë
        run: |
          B=target/release/coprocessor
          $B mock-session --kind age --dob 2001-05-17 --account-id J01234567A \
            --key tests/fixtures/mock_notary_key.pem --cert tests/fixtures/mock_notary_cert.pem \
            --wallet "$WALLET" --out artifacts/age.tls.json
          $B prove --backend snarkjs --input artifacts/age.tls.json --min-age 18 --app ci-age \
            --wasm circuits/build/main_js/main.wasm --zkey circuits/build/main_final.zkey --out artifacts/age_proof.json
          $B verify --proof artifacts/age_proof.json --vk artifacts/vk.json
          jq '{min_value, max_value, nullifier}' artifacts/age_proof.json
          # nën 18 -> duhet të dështojë
          $B mock-session --kind age --dob 2012-03-01 --account-id J0999 \
            --key tests/fixtures/mock_notary_key.pem --cert tests/fixtures/mock_notary_cert.pem \
            --wallet "$WALLET" --out artifacts/minor.tls.json
          if $B prove --backend snarkjs --input artifacts/minor.tls.json --min-age 18 \
               --wasm circuits/build/main_js/main.wasm --zkey circuits/build/main_final.zkey --out /tmp/m.json; then
            echo "i mitur kaloi"; exit 1
          fi
          echo "OK: mosha"

      - name: Programi Solana pranon provën Circom
        run: |
          ZKTLS_CIRCOM_FIXTURE="$PWD/artifacts/circom_fixture.json" \
            cargo test --manifest-path programs/solana-zk-verifier/Cargo.toml accepts_circom_fixture -- --nocapture

      - name: Statistikat e qarkut
        if: always()
        working-directory: circuits
        run: snarkjs r1cs info build/main.r1cs || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circom-artifacts
          path: |
            artifacts/
            circuits/build/verification_key.json

  program:
    name: Anchor → localnet → testet TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            programs/solana-zk-verifier
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalo Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Cache anchor-cli
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ env.ANCHOR_VERSION }}-${{ runner.os }}
      - name: Instalo anchor-cli
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/solana-foundation/anchor --tag "$ANCHOR_VERSION" anchor-cli --locked

      - name: Versionet dhe portofoli
        run: |
          solana --version
          anchor --version
          solana-keygen new --no-bip39-passphrase --silent --force -o ~/.config/solana/id.json

      - name: Build + testet TypeScript në localnet
        env:
          # programi është workspace më vete; artefaktet duhet të dalin në target/deploy të rrënjës
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          npm install
          anchor keys sync
          anchor build
          ls -la target/deploy target/idl || true
          echo "declare_id: $(grep -o 'declare_id!(\"[^\"]*' programs/solana-zk-verifier/src/lib.rs)"
          echo "keypair:    $(solana-keygen pubkey target/deploy/solana_zk_verifier-keypair.json)"
          echo "idl:        $(jq -r .address target/idl/solana_zk_verifier.json)"
          grep -n solana_zk_verifier Anchor.toml
          anchor test --skip-build
      - name: Log-u i validatorit
        if: failure()
        run: tail -n 80 .anchor/test-ledger/test-ledger-log.txt || true
