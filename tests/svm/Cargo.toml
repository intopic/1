# Separate workspace: litesvm 0.18 needs a newer host Rust (1.98.1) than the
# program workspace (1.95.0). It has its own lockfile and toolchain pin.
[package]
name = "svm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
litesvm = "=0.18.1"
sharded-amm = { path = "../../programs/sharded-amm", features = ["no-entrypoint"] }
solana-account = "^4.3.0"
solana-instruction = "~3.5.0"
solana-keypair = "^3.1.2"
solana-message = "^4.2.4"
solana-signer = "^3.0.1"
solana-transaction = "^4.1.5"
solana-transaction-error = "~3.4.0"
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["token", "token_2022", "solana-v4"] }

# litesvm 0.18.1 does not compile against the Agave 4.4 crates that its
# caret requirements allow; pin the SVM runtime to the 4.3 line (= Agave 4.3.2).
agave-feature-set = "=4.3.2"
agave-reserved-account-keys = "=4.3.2"
solana-bpf-loader-program = "=4.3.2"
solana-builtins = "=4.3.2"
solana-builtins-default-costs = "=4.3.2"
solana-compute-budget = "=4.3.2"
solana-compute-budget-instruction = "=4.3.2"
solana-compute-budget-program = "=4.3.2"
solana-fee = "=4.3.2"
solana-program-runtime = "=4.3.2"
solana-runtime-transaction = "=4.3.2"
solana-svm-callback = "=4.3.2"
solana-svm-feature-set = "=4.3.2"
solana-svm-log-collector = "=4.3.2"
solana-svm-measure = "=4.3.2"
solana-svm-timings = "=4.3.2"
solana-svm-type-overrides = "=4.3.2"
solana-syscalls = "=4.3.2"
solana-system-program = "=4.3.2"
solana-transaction-context = "=4.3.2"
solana-vote-program = "=4.3.2"
solana-zk-elgamal-proof-program = "=4.3.2"
solana-zk-token-proof-program = "=4.3.2"

[workspace]
