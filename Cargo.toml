[workspace]
members = ["crates/amm-model", "programs/sharded-amm"]
exclude = ["env-smoke", "env-anchor"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
