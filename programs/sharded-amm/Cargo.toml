[package]
name = "sharded-amm"
version = "0.1.0"
description = "Sharded-tick CLMM: 8 initial shards, capacity 56 (work in progress, unaudited)"
edition.workspace = true
publish.workspace = true

[lib]
name = "sharded_amm"
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["token", "token_2022", "solana-v4"] }
# Fixed-width U256/U512 for the 288-bit products in math/ (ADR-0001).
uint = { version = "=0.10.0", default-features = false }
# Required by Anchor zero-copy accounts (TickArray).
bytemuck = { version = "1.17", features = ["derive", "min_const_generics"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
