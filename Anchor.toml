[features]
resolution = true
skip-lint = false

[workspace]
members = ["programs/solana-zk-verifier"]

[programs.localnet]
solana_zk_verifier = "ZkTLSCoprocessor111111111111111111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 programs/solana-zk-verifier/tests/**/*.ts"

[test]
startup_wait = 60000
# deploy si program i përditësueshëm me portofolin e provider-it si upgrade authority
# (`initialize` e kërkon këtë)
upgradeable = true
